name: CI

on:
  push:
    branches: [dev, main, prod]
  pull_request:
    branches: [dev, main, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups --python 3.13

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type-check
        run: uv run --no-sync mypy src

      - name: Build wheel and source distribution
        run: uv build

  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Run unit and integration tests with branch coverage
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} pytest
          --cov=learning_atlas
          --cov-report=term-missing
          --cov-report=xml

      - name: Enforce raw branch coverage floor
        run: >-
          uv run --no-sync --python ${{ matrix.python-version }} python
          scripts/check_branch_coverage.py coverage.xml --minimum 90
