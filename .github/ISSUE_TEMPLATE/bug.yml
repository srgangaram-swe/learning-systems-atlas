name: Bug report
description: Report a reproducible correctness, reliability, or documentation defect.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the smallest reproducible example and full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and provenance
      description: Python/platform, config, seed, Git SHA, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Scientific or user impact
      description: Note data leakage, reproducibility, numerical, or security implications.
    validations:
      required: true
