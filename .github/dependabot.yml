version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5
    labels: [dependencies, infra]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5
    labels: [dependencies, infra]
