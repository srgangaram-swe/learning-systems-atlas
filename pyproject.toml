[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "learning-systems-atlas"
version = "1.0.0"
description = "A reproducible atlas of supervised, unsupervised, deep, and reinforcement learning systems."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Saif Ryan Gangaram" }]
keywords = [
  "automatic-differentiation",
  "deep-learning",
  "machine-learning",
  "neural-networks",
  "pytorch",
  "supervised-learning",
  "unsupervised-learning",
  "reinforcement-learning",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium~=1.3.0",
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<2.5",
  "pydantic~=2.12.0",
  "pyyaml>=6.0,<7",
  "scikit-learn~=1.9.0",
  "seaborn>=0.13.2,<0.14",
  "torch>=2.9,<3",
  "typer>=0.20,<1",
]

[project.scripts]
learning-atlas = "learning_atlas.cli:main"

[project.optional-dependencies]
# Mirrors the PEP 735 group below for pip-compatible contributor bootstrapping.
dev = [
  "build>=1.4,<1.5",
  "hypothesis>=6.135,<7",
  "mypy==2.1.0",
  "pre-commit>=4.5,<5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
  "types-pyyaml>=6.0.12,<7",
]

[project.urls]
Repository = "https://github.com/srgangaram-swe/learning-systems-atlas"
Issues = "https://github.com/srgangaram-swe/learning-systems-atlas/issues"

[dependency-groups]
dev = [
  "build>=1.4,<1.5",
  "hypothesis>=6.135,<7",
  "mypy==2.1.0",
  "pre-commit>=4.5,<5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
  "types-pyyaml>=6.0.12,<7",
]
docs = [
    "ipykernel>=6.30,<8",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=0.30,<1",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[tool.uv]
required-version = "==0.11.28"

# CPU wheels keep CI and contributor environments small and hardware-neutral;
# reference profiles are CPU-deterministic by design.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/learning_atlas"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["seaborn.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
markers = [
  "unit: fast, isolated behavioral tests",
  "integration: cross-component and command-line tests",
]

[tool.coverage.run]
branch = true
source = ["learning_atlas"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@overload",
]
